<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>National Vitality Observatory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap">
<style>
:root{
  --bg:#EAF0ED; --panel:#FAFCFB; --panel2:#F1F5F3; --ink:#12201C; --ink2:#4B5D57; --ink3:#7A8B85;
  --line:#D3DDD9; --line2:#E3EAE7; --accent:#0A6B60; --accent-soft:#D3EAE4;
  --good:#2C8A4C; --warn:#B7770C; --crit:#BF3A2E; --good-soft:#DCEFE2; --warn-soft:#F6EAD2; --crit-soft:#F6DDDA;
  --display:"IBM Plex Sans Condensed","IBM Plex Sans Arabic","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --note:"Spectral","Noto Naskh Arabic",Georgia,"Times New Roman",serif;
  --fwd:"→";
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1311; --panel:#101B18; --panel2:#15221F; --ink:#DCE8E3; --ink2:#95A9A2; --ink3:#6C807A;
    --line:#223430; --line2:#1A2926; --accent:#46C1AC; --accent-soft:#16332D;
    --good:#4CC27A; --warn:#E3A83C; --crit:#F0675B; --good-soft:#15301F; --warn-soft:#33280F; --crit-soft:#3A1916;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1311; --panel:#101B18; --panel2:#15221F; --ink:#DCE8E3; --ink2:#95A9A2; --ink3:#6C807A;
  --line:#223430; --line2:#1A2926; --accent:#46C1AC; --accent-soft:#16332D;
  --good:#4CC27A; --warn:#E3A83C; --crit:#F0675B; --good-soft:#15301F; --warn-soft:#33280F; --crit-soft:#3A1916;
}
:root:lang(ar){
  --display:"IBM Plex Sans Arabic","IBM Plex Sans Condensed",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;
  --note:"Noto Naskh Arabic","Spectral",serif;
  --fwd:"←";
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
[hidden]{display:none!important}
.wrap{max-width:1440px;margin:0 auto;padding-inline:clamp(16px,2.4vw,32px);padding-block:18px 48px;display:flex;flex-direction:column;gap:16px}
button,select,input{font:inherit;color:inherit}
svg{direction:ltr}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--display);font-weight:600;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
:lang(ar) .eyebrow,:lang(ar) .chip,:lang(ar) .pill,:lang(ar) .core-lbl,:lang(ar) .core-cond,:lang(ar) .iv .rec,:lang(ar) .kgrid .l{letter-spacing:0;text-transform:none}
:lang(ar) .eyebrow{font-size:12.5px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h2{font-size:17px;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.panel-head p{margin:0;color:var(--ink3);font-size:12.5px}

header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}
.brand h1{font-size:clamp(24px,3vw,32px);font-weight:700;line-height:1.1}
.brand .sub{color:var(--ink2);margin-top:4px;font-size:13px;max-width:70ch}
.brand .sub b{font-weight:600;color:var(--ink)}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:13px;line-height:1.2}
.btn:hover{border-color:var(--ink3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn:focus-visible,select:focus-visible,input:focus-visible,.vtile:focus-visible,.row-btn:focus-visible,.seg button:focus-visible,.org-node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:7px 8px;font-size:13px}
.acct{display:flex;align-items:center;gap:6px;padding-inline-start:10px;border-inline-start:1px solid var(--line2)}
.acct-u{font-size:12.5px;color:var(--ink2);white-space:nowrap}.acct-u em{font-style:normal;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-inline-start:4px}
.acct a.btn{text-decoration:none;display:inline-flex;align-items:center;color:var(--ink)}
.ai-plat{font-size:12.5px;margin:6px 0 0;color:var(--ink2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}.ai-plat .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}.ai-plat.ok .dot{background:var(--good)}.ai-plat a{color:var(--accent)}
.clock{font-family:var(--mono);font-size:12.5px;padding:7px 10px;border-radius:5px;background:var(--panel2);border:1px solid var(--line2);white-space:nowrap}
.clock .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink3);margin-inline-end:6px;vertical-align:1px}
.clock.live .dot{background:var(--crit);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
.seg button+button{border-inline-start:1px solid var(--line)}
.pipeline{display:flex;flex-wrap:wrap;gap:4px 0;font-family:var(--display);font-size:12.5px;color:var(--ink3)}
.pipeline a{white-space:nowrap;color:inherit;text-decoration:none;border-radius:3px}
.pipeline a:hover{color:var(--accent);text-decoration:underline}
.pipeline a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pipeline a+a::before{content:var(--fwd);margin:0 8px;color:var(--line);display:inline-block;text-decoration:none}
.pipeline .on{color:var(--accent);font-weight:600}
.pipeline .imp-link{color:var(--panel);background:var(--accent);padding:1px 8px;font-weight:600}
.pipeline .imp-link::before{content:none}
.pipeline .imp-link{margin-inline:10px 2px}
.disclaimer{font-size:12px;color:var(--ink3)}

/* data source */
.datasrc{display:flex;flex-direction:column;gap:10px}
.ds-row{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap}
.ds-row h2{margin-inline-end:4px}
.ds-status{font-size:13px;color:var(--ink2);flex:1;min-width:220px}
.ds-status b{color:var(--ink);font-weight:600}
.badge{display:inline-block;font-family:var(--display);font-weight:600;font-size:11px;padding:2px 7px;border-radius:3px;vertical-align:1px}
.drop{border:1.5px dashed var(--line);border-radius:6px;padding:10px 12px;font-size:12.5px;color:var(--ink3);display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.report{font-size:12.5px}
.report summary{cursor:pointer;font-weight:600;color:var(--ink)}
.report ul{margin:8px 0 0;padding-inline-start:18px;display:flex;flex-direction:column;gap:3px;color:var(--ink2)}
.report li.e{color:var(--crit)} .report li.w{color:var(--warn)} .report li.ok{color:var(--good)}
.report code{font-family:var(--mono);font-size:11.5px}
.covgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 16px;margin-top:8px}
.covgrid div{display:flex;justify-content:space-between;gap:8px;font-size:12px}

.g-top{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.15fr) minmax(0,.9fr);gap:16px}
.g-mid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
@media (max-width:1180px){.g-top{grid-template-columns:1fr 1fr}.g-top .organism{grid-column:1/-1;order:-1}.g-mid{grid-template-columns:1fr}}
@media (max-width:760px){.g-top{grid-template-columns:1fr}}

.cond{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 8px;font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-good{color:var(--good);background:var(--good-soft)}
.s-warn{color:var(--warn);background:var(--warn-soft)}
.s-crit{color:var(--crit);background:var(--crit-soft)}
.s-neutral{color:var(--accent);background:var(--accent-soft)}
.s-none{color:var(--ink3);background:var(--panel2)}
.note{font-family:var(--note);font-size:16.5px;line-height:1.5;margin:0 0 12px}
:lang(ar) .note{font-size:17px;line-height:1.7}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13px}
.dl dt{color:var(--ink3);white-space:nowrap}
.dl dd{margin:0;font-weight:500;min-width:0}
.mech{margin-top:12px;padding:10px 12px;border-radius:5px;background:var(--panel2);border:1px solid var(--line2);font-size:12.5px}
.mech .chain{font-family:var(--note);font-size:14.5px;margin-top:3px;line-height:1.6}
.mech .chain b{font-weight:500}
.warns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.warn{border:1px solid var(--line);border-radius:5px;padding:9px 11px;font-size:12.5px}
.warn .wt{display:flex;gap:8px;align-items:center;font-weight:600;font-family:var(--display);font-size:13.5px}
.warn .wt .tri{color:var(--warn)}
.warn p{margin:3px 0 0;color:var(--ink2)}
.flag{margin-top:12px;padding:9px 11px;border-radius:5px;background:var(--crit-soft);font-size:12.5px}
.flag b{color:var(--crit)}
.infoline{margin-top:10px;font-size:12px;color:var(--warn)}

.organism svg{width:100%;height:auto;display:block;max-width:560px;margin:0 auto}
.org-node{cursor:pointer;outline:none}
.org-node:hover .org-bg{stroke:var(--ink3)}
.org-bg{fill:var(--panel2);stroke:var(--line);stroke-width:1}
.org-arc{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dasharray .6s ease,stroke .6s}
.org-val{font-family:var(--mono);font-size:15px;font-weight:600;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.org-lbl{font-family:var(--display);font-size:12.5px;font-weight:600;fill:var(--ink);text-anchor:middle}
.org-sub{font-family:var(--body);font-size:9.5px;fill:var(--ink3);text-anchor:middle}
.org-sel .org-bg{stroke:var(--accent);stroke-width:2}
.org-edge{fill:none;stroke-linecap:round;stroke-dasharray:1.5 9;animation:flow 1.6s linear infinite;opacity:.55}
@keyframes flow{to{stroke-dashoffset:-21}}
.halo{fill:none;stroke:var(--crit);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.org-critical .halo{animation:halo 1.8s ease-out infinite}
.org-node.org-sel .site{stroke:var(--accent);stroke-width:2.5}
@keyframes halo{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}
.heart-ring{fill:none;stroke:var(--accent);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:beat var(--beat,1.2s) ease-out infinite}
@keyframes beat{0%{opacity:.55;transform:scale(1)}70%{opacity:0;transform:scale(1.28)}100%{opacity:0}}
.core-num{font-family:var(--mono);font-weight:600;font-size:40px;fill:var(--ink);text-anchor:middle}
.core-lbl{font-family:var(--display);font-size:11px;letter-spacing:.12em;fill:var(--ink3);text-anchor:middle}
.core-cond{font-family:var(--display);font-size:14px;font-weight:700;letter-spacing:.08em;text-anchor:middle}
.core-land{stroke-width:1;stroke-linejoin:round;fill-rule:evenodd;opacity:.6}
.core-num,.core-lbl,.core-cond,.core-name{paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.core-name{font-family:var(--display);font-size:13px;font-weight:600;fill:var(--ink);text-anchor:middle}
.org-sys{font-family:var(--body);font-size:10px;fill:var(--ink2);text-anchor:middle}
#orgSvg.hovering .org-edge{opacity:.08}
#orgSvg.hovering .org-edge.hl{opacity:1;stroke-width:2.4}
.org-node.dim{opacity:.35}
.readhow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px;font-size:11.5px;color:var(--ink2);margin-top:10px;padding-top:10px;border-top:1px solid var(--line2)}
.readhow b{color:var(--ink);font-weight:600;display:block;font-family:var(--display);font-size:12px}
.wbprog{font-size:12.5px;color:var(--ink2)}
.impact{margin-top:10px;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--panel2)}
.impact h3{font-size:14px;font-weight:600;margin-bottom:6px}
.impact .ig{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:12.5px}
.impact .ig .v{font-family:var(--mono);text-align:end;direction:ltr;font-weight:500}
.impact .hits{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.impact .foot{font-size:11.5px;color:var(--ink3);margin-top:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:-6px}
.tabs button{border:0;background:none;padding:8px 14px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:0;border-bottom:3px solid transparent;margin-bottom:-1px;color:var(--ink2)}
.tabs button span:last-child{font-family:var(--display);font-weight:600;font-size:15px}
.tabs .tk{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-family:var(--display);font-weight:600}
:lang(ar) .tabs .tk{letter-spacing:0;font-size:11.5px}
.tabs button[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--ink)}
.tabs button:hover{color:var(--ink)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.adv-ctl{margin-bottom:12px;gap:8px 10px}
.adv-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr) minmax(0,1.15fr);gap:18px}
@media (max-width:1100px){.adv-grid{grid-template-columns:1fr 1fr}.adv-grid .adv-col:last-child{grid-column:1/-1}}
@media (max-width:720px){.adv-grid{grid-template-columns:1fr}}
.adv-col{min-width:0}
.adv-col h3{font-size:15px;font-weight:600;margin-bottom:4px}
.adv-hint{font-size:12px;color:var(--ink3);margin:0 0 8px}
.adv-err{font-size:12.5px;color:var(--crit)}
.bm-row{padding:8px 0;border-bottom:1px solid var(--line2)}
.bm-k{font-size:13px;font-weight:500}
.bm-k small{color:var(--ink3);font-weight:400}
.bm-na{font-size:11.5px;color:var(--ink3);font-style:italic}
.bm-bar{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--crit-soft),var(--warn-soft),var(--good-soft));margin:6px 0 5px;direction:ltr}
.bm-bar .q{position:absolute;top:0;bottom:0;background:var(--ink3);opacity:.35;border-radius:2px}
.bm-bar b{position:absolute;top:-3px;width:4px;height:14px;margin-left:-2px;background:var(--ink);border-radius:2px}
.bm-nums{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:11.5px;color:var(--ink2);align-items:center}
.bm-nums strong{color:var(--ink);font-weight:600}
.imp-row{padding:7px 0;border-bottom:1px solid var(--line2)}
.imp-line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;font-size:12.5px;padding:2px 0}
.imp-line .yrs{color:var(--ink3);font-size:11px}
.pb{border:1px solid var(--line2);border-radius:5px;padding:8px 10px;margin:6px 0;background:var(--panel)}
.pb-t{font-weight:600;font-size:13.5px;display:flex;gap:8px;align-items:baseline}
.pb-t .num{font-family:var(--mono);color:var(--accent)}
.pb-d{font-size:12.5px;color:var(--ink2);margin:2px 0 4px}
.pb-m{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:11.5px;color:var(--ink3)}
.pb-sim{margin-top:6px;padding:4px 9px;font-size:12px}
.ai-box{margin-top:12px;border:1px solid var(--accent);border-radius:6px;padding:10px 12px;background:var(--accent-soft)}
.ai-set{font-size:12.5px;margin-top:4px}
.ai-set summary{cursor:pointer;color:var(--accent);font-weight:500}
.ai-set input[type=password]{width:100%;margin:4px 0;border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:var(--panel);font-family:var(--mono);font-size:12px;direction:ltr}
.ai-rem{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink2)}
#aiOut{margin-top:8px}
.ai-diag p,.ai-rec p{font-size:12.5px;margin:2px 0 6px}
.ai-rec{background:var(--panel);border:1px solid var(--line2);border-radius:5px;padding:8px 10px;margin:6px 0}
.ai-rec ul,.watch{margin:2px 0 6px;padding-inline-start:18px;font-size:12.5px}
.ai-rec .risk{color:var(--ink2)}
.adv-caveat{font-size:11.5px;color:var(--ink3);font-style:italic}
.views{margin:-4px 0 8px;flex-wrap:wrap}
.views button{font-size:12.5px;padding:5px 10px}
.btn-improve{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:600}
.btn-improve:hover{filter:brightness(1.08)}
.btn-improve.sm{margin-top:0;padding:5px 10px;font-size:12.5px}
#advisor{scroll-margin-top:12px}
#advisor.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.art .skin{fill:var(--tint,var(--panel2));stroke:var(--edge,var(--ink3));stroke-width:1.2;opacity:.85}
.art .limb{fill:none;stroke:var(--tint,var(--panel2));stroke-width:30;stroke-linecap:round}
.art .glyph{fill:none;stroke:var(--ink3);stroke-width:1.2;opacity:.7}
.art .heartg{fill:var(--crit);opacity:.35;stroke:none;transform-box:fill-box;transform-origin:center;animation:hb var(--beat,1.2s) ease-in-out infinite}
@keyframes hb{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}}
.art .spine{stroke:var(--ink3);stroke-width:2;stroke-dasharray:3 4;opacity:.7}
.art .bone{stroke:var(--ink3);stroke-width:3;stroke-linecap:round;opacity:.35}
.art .leaf{fill:var(--tint,var(--good-soft));stroke:var(--edge,var(--good));stroke-width:1;opacity:.75}
.art .trunk{fill:#8a6a4a;opacity:.55}
.art .root{fill:none;stroke:#8a6a4a;stroke-width:4;stroke-linecap:round;opacity:.45}
.art .ground{stroke:var(--line);stroke-width:1.5}
.art .fruit{fill:var(--warn);opacity:.7}
.art .membrane{fill:none;stroke:var(--edge,var(--accent));stroke-width:7;opacity:.5}
.art .cyto{fill:var(--tint,var(--accent-soft));opacity:.6}
.art .cytosk{fill:none;stroke:var(--ink3);stroke-width:1;stroke-dasharray:2 4;opacity:.6}
.art .nucleus{fill:var(--panel);stroke:var(--ink2);stroke-width:1.5;opacity:.9}
.art .nucleolus{fill:var(--ink3);opacity:.35}
.art .chromo{fill:none;stroke:var(--ink2);stroke-width:1.5;opacity:.6}
.art .mito{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.2}
.art .mitoline{fill:none;stroke:var(--warn);stroke-width:1}
.art .vacuole{fill:var(--panel);stroke:var(--ink3);stroke-width:1;opacity:.8}
.art .channel{fill:var(--panel);stroke:var(--ink2);stroke-width:1.2}
.art .ribo{fill:var(--ink2);opacity:.6}
.art .recp{fill:none;stroke:var(--ink2);stroke-width:1.6;stroke-linecap:round}
.org-edge.thin{opacity:.35}
.badge-bg{fill:var(--panel);stroke:var(--line)}
.badge-name{font-family:var(--display);font-size:12px;font-weight:600;fill:var(--ink)}
.badge-num{font-family:var(--mono);font-size:22px;font-weight:600;fill:var(--ink)}
.badge-cond{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.06em}
:lang(ar) .badge-name,:lang(ar) .badge-num,:lang(ar) .badge-cond{text-anchor:end}
.comb{fill:none;stroke:var(--line2);stroke-width:1}
.hex{stroke-width:2;stroke-linejoin:round}
.core-hex{fill:var(--panel);stroke:var(--ink3)}
.hexfill{fill:var(--panel2);stroke:var(--line);transition:fill .5s,stroke .5s}
.hexnode:hover .hexfill{stroke-width:3}
.hexnode.org-sel .hexfill{stroke:var(--accent)!important;stroke-width:4}
.hexhalo{fill:none;stroke:var(--crit);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.hexnode.org-critical .hexhalo{animation:halo 1.8s ease-out infinite}
.hex-part{font-family:var(--display);font-size:11.5px;font-weight:600;fill:var(--ink);text-anchor:middle}
.hex-sys{font-family:var(--body);font-size:10px;fill:var(--ink2);text-anchor:middle}
.hexval{font-size:20px}
.core-name.small{font-size:11px}.core-num.mid{font-size:28px}.core-cond.small{font-size:11px}
.site{stroke:var(--panel);stroke-width:1.5}
.site-halo{fill:none;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.org-critical .site-halo{animation:halo 1.6s ease-out infinite}
.leader{fill:none;stroke-width:1;opacity:.6}
.mappick{display:flex;gap:6px;align-items:center}
.mappick select{max-width:190px;padding:4px 6px;font-size:12.5px}
.orgcap{text-align:center;font-size:11px;color:var(--ink3);margin-top:4px}
.country{stroke:var(--ink2);stroke-width:1.2;stroke-linejoin:round;fill-rule:evenodd;transition:fill .6s}
.country-glow{fill:none;stroke-linejoin:round;stroke-width:6;opacity:0;animation:breathe var(--beat,1.2s) ease-out infinite}
@keyframes breathe{0%{opacity:.35}70%{opacity:0}100%{opacity:0}}
.leader{fill:none;stroke-width:1;opacity:.55}
.site{stroke:var(--panel);stroke-width:1.5}
.site-halo{fill:none;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.org-critical .site-halo{animation:halo 1.6s ease-out infinite}
.nvi-tag{font-family:var(--mono);font-size:15px;font-weight:600;fill:var(--ink);text-anchor:middle}
.nvi-tag .c{font-family:var(--display);font-size:13px;letter-spacing:.06em}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:11.5px;color:var(--ink3);margin-top:4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:5px;vertical-align:-1px}

.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big .n{font-family:var(--mono);font-size:52px;font-weight:600;line-height:1;letter-spacing:-.02em}
.big .of{font-family:var(--mono);color:var(--ink3);font-size:15px}
.dir{font-family:var(--display);font-weight:600;font-size:14px}
.compare{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:12px 0;font-size:12.5px;padding-block:10px;border-block:1px solid var(--line2)}
.compare .v{font-family:var(--mono);text-align:end;font-weight:500;direction:ltr}
.compare .muted{color:var(--ink3);grid-column:1/-1;font-size:11.5px;margin-top:-2px}
.radar svg{width:100%;height:auto;display:block;max-width:360px;margin:0 auto}
.radar text{font-family:var(--display);font-size:12px;fill:var(--ink2)}
.radar .rv{font-family:var(--mono);font-size:11px;font-weight:600}

.vgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:1100px){.vgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:860px){.vgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.vtile{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px 8px;cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:4px;min-width:0}
.vtile:hover{border-color:var(--ink3)}
.vtile.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.vtile .row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.vtile .organ{font-family:var(--note);font-style:italic;font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
:lang(ar) .vtile .organ{font-style:normal}
.chip{font-family:var(--display);font-weight:600;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;padding:1px 6px;border-radius:3px;white-space:nowrap}
.vtile .nm{font-family:var(--display);font-weight:600;font-size:14px;line-height:1.25;min-height:35px}
.vtile .val{display:flex;align-items:baseline;gap:8px}
.vtile .val .n{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1}
.vtile .val .d{font-family:var(--mono);font-size:12px;direction:ltr}
.vtile svg{width:100%;height:34px;display:block}
.ew{font-size:11px;color:var(--warn);font-weight:600;font-family:var(--display);min-height:15px}
.ew .cov{color:var(--ink3);font-weight:500}
.up{color:var(--good)} .down{color:var(--crit)} .flat{color:var(--ink3)}

.crumbs{display:flex;flex-wrap:wrap;gap:4px;font-size:12.5px;color:var(--ink3);align-items:center}
.crumbs button{background:none;border:0;padding:0;cursor:pointer;color:var(--accent);font-weight:500}
.drill{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;margin-top:12px}
@media (max-width:860px){.drill{grid-template-columns:1fr}}
.contrib{display:flex;flex-direction:column}
.row-btn{display:grid;grid-template-columns:10px minmax(0,1fr) auto 18px;gap:8px;align-items:center;padding:7px 6px;border:0;border-bottom:1px solid var(--line2);background:none;cursor:pointer;text-align:start;border-radius:3px}
.row-btn:hover{background:var(--panel2)}
.row-btn.sel{background:var(--accent-soft)}
.row-btn .dot{width:9px;height:9px;border-radius:50%}
.row-btn .kn{font-size:13px;line-height:1.3}
.row-btn .kn small{display:block;color:var(--ink3);font-size:11px}
.row-btn .kv{font-family:var(--mono);font-size:12.5px;text-align:end;white-space:nowrap}
.row-btn .ka{font-family:var(--mono);font-size:13px;text-align:center}
.wbar{height:3px;background:var(--line2);border-radius:2px;margin-top:3px;overflow:hidden}
.wbar i{display:block;height:100%}
.kcard{border:1px solid var(--line);border-radius:6px;padding:14px;background:var(--panel2);min-width:0}
.kcard h3{font-size:18px;font-weight:600}
.kcard .def{color:var(--ink2);font-size:12.5px;margin:3px 0 10px}
.kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px;margin-bottom:10px}
@media (max-width:480px){.kgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kgrid div{min-width:0}
.kgrid .l{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;font-family:var(--display);font-weight:600}
.kgrid .v{font-size:13px;font-weight:500;overflow-wrap:anywhere}
.kgrid .v.mono{font-size:15px}
.ksec{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.ksec .eyebrow{margin-bottom:4px}
.imp{display:flex;flex-wrap:wrap;gap:6px}
.conn{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12.5px}
.conn .col{display:flex;flex-direction:column;gap:3px}
.conn .col div{display:flex;justify-content:space-between;gap:6px}
.kdiag{font-family:var(--note);font-size:15.5px;margin-top:4px}
.kspark svg{width:100%;height:56px;display:block}
.nudge{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--ink3)}
.nudge .btn{padding:4px 9px;font-size:12px}

.budget{display:flex;align-items:center;gap:10px;font-size:12.5px;margin-bottom:10px}
.budget .bar{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.budget .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.ivlist{display:flex;flex-direction:column;gap:6px}
.iv{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:start;padding:8px 10px;border:1px solid var(--line2);border-radius:5px;background:var(--panel)}
.iv.on{border-color:var(--accent);background:var(--accent-soft)}
.iv input{margin:3px 0 0;accent-color:var(--accent);width:15px;height:15px}
.iv label{cursor:pointer;font-weight:600;font-size:13px;line-height:1.35}
.iv .meta{grid-column:2/4;font-size:11.5px;color:var(--ink3);margin-top:-2px}
.iv .cost{font-family:var(--mono);font-size:12px;color:var(--ink2);white-space:nowrap}
.iv .rec{font-family:var(--display);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-inline-start:6px}
.iv .ramp{grid-column:2/4;height:3px;background:var(--line2);border-radius:2px;overflow:hidden}
.iv .ramp i{display:block;height:100%;background:var(--accent)}
.shocks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.btn.shock{border-color:var(--crit-soft);background:var(--crit-soft);color:var(--crit);font-size:12.5px;padding:6px 10px}
.btn.shock:hover:not(:disabled){border-color:var(--crit)}
.active-shocks{font-size:12px;color:var(--ink3);margin-top:6px;min-height:17px}
.locked{font-size:12px;color:var(--warn);margin-bottom:8px}
.sub-h{margin:16px 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}

.ledger{display:flex;flex-direction:column;gap:12px}
.asset{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr) 92px;gap:12px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line2)}
@media (max-width:640px){.asset{grid-template-columns:1fr auto}.asset .flows{grid-column:1/-1;order:3}}
.asset .an{font-family:var(--display);font-weight:600;font-size:14px}
.asset .an small{display:block;font-family:var(--body);font-weight:400;color:var(--ink3);font-size:11.5px}
.flows{display:grid;grid-template-columns:1fr 1fr}
.flows .side{display:flex;flex-direction:column;gap:3px}
.flows .side.l{border-inline-end:1px solid var(--ink3)}
.flows .fb{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2);width:100%}
.flows .l .fb{flex-direction:row-reverse}
.flows .fb i{display:block;height:9px;border-radius:1px;flex:none}
.flows .l .fb i{background:var(--crit);opacity:.75}
.flows .r .fb i{background:var(--good);opacity:.75}
.flows .fb.nodata{color:var(--ink3);font-style:italic}
.flows .fb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.flows .l .fb span{text-align:end}
.asset .net{text-align:end}
.asset .net .n{font-family:var(--mono);font-size:17px;font-weight:600;direction:ltr;display:inline-block}
.asset .net small{display:block;color:var(--ink3);font-size:11px}
.flowhead{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr) 92px;gap:12px;font-size:11px;color:var(--ink3)}
.flowhead .fh{display:grid;grid-template-columns:1fr 1fr}
.flowhead .fh span:first-child{text-align:end;padding-inline-end:8px}
.flowhead .fh span:last-child{padding-inline-start:8px}
@media (max-width:640px){.flowhead{display:none}}

.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-size:10.5px;fill:var(--ink3)}
.chart text.lbl{font-family:var(--display);font-size:11px}
.ckey{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-bottom:6px}
.ckey i{display:inline-block;width:16px;height:0;border-top:2px solid;margin-inline-end:6px;vertical-align:3px}
.log{max-height:230px;overflow:auto;display:flex;flex-direction:column;border-top:1px solid var(--line2);margin-top:12px}
.log div{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:6px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.log .lt{font-family:var(--mono);color:var(--ink3);font-size:11.5px}
:lang(ar) .log .lt{font-family:var(--body)}
.log .k-shock{color:var(--crit)} .log .k-iv{color:var(--accent)} .log .k-warn{color:var(--warn)}

details.method{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 16px}
details.method summary{cursor:pointer;font-family:var(--display);font-weight:600;font-size:15px}
.method-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:12px;font-size:13px;color:var(--ink2)}
.method-body h3{font-size:14px;color:var(--ink);margin-bottom:4px}
.method-body p{margin:0 0 6px;max-width:65ch}
.method-body code{font-family:var(--mono);font-size:12px;background:var(--panel2);padding:1px 4px;border-radius:3px;color:var(--ink)}
@media (prefers-reduced-motion: reduce){.art .heartg,.hexhalo,.country-glow,.site-halo,.org-edge,.halo,.heart-ring,.clock.live .dot{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="tabs" id="tabs" role="tablist" aria-label="Observatory">
    <button role="tab" data-tab="nation" id="tabNation" aria-selected="true"><span class="tk" data-i18n="tabNationK"></span><span data-i18n="tabNation"></span></button>
    <button role="tab" data-tab="gov" id="tabGov" aria-selected="false"><span class="tk" data-i18n="tabGovK"></span><span data-i18n="tabGov"></span></button>
  </nav>
  <header class="top">
    <div class="brand">
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1 data-i18n="title"></h1>
      <div class="sub" id="subline"></div>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Language">
        <button id="langEn" aria-pressed="true">EN</button><button id="langAr" aria-pressed="false" lang="ar">عربي</button>
      </div>
      <label class="eyebrow" for="scenario" id="caseLbl" data-i18n="case" hidden></label>
      <select id="scenario" hidden></select>
      <button class="btn primary" id="play"></button>
      <button class="btn" id="stepBtn" data-i18n="step"></button>
      <select id="speed" aria-label="Speed"><option value="900">1×</option><option value="450" selected>2×</option><option value="180">5×</option></select>
      <button class="btn" id="reset" data-i18n="reset"></button>
      <div class="clock" id="clock"><span class="dot"></span><span id="clockTxt">—</span></div>
      <div class="acct" id="acct" hidden></div>
    </div>
  </header>

  <section class="panel datasrc" id="datasrc">
    <div class="ds-row">
      <h2 data-i18n="dataSource"></h2>
      <div class="seg" role="group" aria-label="Data source">
        <button id="modeOnline" aria-pressed="true" data-i18n="modeOnline"></button><button id="modeReal" aria-pressed="false" data-i18n="modeFiles"></button>
      </div>
      <div class="ds-status" id="dsStatus"></div>
      <button class="btn" id="replay" data-i18n="replay" disabled></button>
    </div>
    <div id="onlineBox">
      <div class="drop">
        <label class="eyebrow" for="wbCountry" data-i18n="wbCountry"></label>
        <select id="wbCountry"></select>
        <button class="btn" id="wbRefresh" data-i18n="wbRefresh"></button>
        <button class="btn" id="wbAll" data-i18n="wbAll"></button>
        <button class="btn" id="wbLoadSnap" data-i18n="wbLoadSnap"></button>
        <span class="wbprog" id="wbProg" role="status"></span>
        <input type="file" id="snapInput" accept=".json,application/json" hidden>
      </div>
    </div>
    <div id="realBox" hidden>
      <div class="drop" id="drop">
        <button class="btn primary" id="openFolder" data-i18n="openFolder"></button>
        <button class="btn" id="reconnect" hidden></button>
        <button class="btn" id="chooseFiles" data-i18n="chooseFiles"></button>
        <button class="btn" id="reloadData" data-i18n="reload" disabled></button>
        <label class="eyebrow" for="geo" id="geoLbl" data-i18n="geo" hidden></label>
        <select id="geo" hidden></select>
        <button class="btn" id="loadSample" data-i18n="sample"></button>
        <span data-i18n="dropHint"></span>
        <input type="file" id="dirInput" webkitdirectory multiple hidden>
        <input type="file" id="fileInput" accept=".csv,.tsv,.txt,.json" multiple hidden>
      </div>
    </div>
    <div class="report" id="report"></div>
    <div class="ds-row" style="font-size:12.5px;color:var(--ink3)">
      <span data-i18n="fmtHelp"></span>
      <button class="btn" id="dlTemplates" data-i18n="templates"></button>
      <button class="btn" id="exportRun" data-i18n="exportRun"></button>
    </div>
  </section>

  <nav class="pipeline" aria-label="Observatory flow">
    <a href="#vitals" data-jump="#vitals" data-i18n="pipe1"></a><a href="#vitals" data-jump="#vitals" data-i18n="pipe2"></a><a href="#orgSvg" data-jump=".organism" data-i18n="pipe3"></a><a href="#score" data-jump="#score" class="on" data-i18n="pipe4"></a><a href="#diag" data-jump="#diag" data-i18n="pipe5"></a><a href="#drillPanel" data-jump="#drillPanel" data-i18n="pipe6"></a><a href="#advisor" data-jump="#advisor" class="imp-link" data-i18n="pipeImprove"></a><a href="#treat" data-jump="#treat" data-i18n="pipe7"></a><a href="#trend" data-jump="#trend" data-i18n="pipe8"></a>
  </nav>

  <section class="g-top">
    <div class="panel" id="diag"></div>
    <div class="panel organism">
      <div class="panel-head"><div><h2 data-i18n="organism"></h2><p id="orgSub"></p></div>
        <div class="mappick"><label class="eyebrow" for="mapCountry" data-i18n="mapLbl"></label><select id="mapCountry"></select></div></div>
      <div class="seg views" role="group" aria-label="Organism view"><button data-view="ring" data-i18n="view_ring"></button><button data-view="body" data-i18n="view_body"></button></div>
      <svg id="orgSvg" viewBox="0 0 500 500" role="img" aria-label="Organ health diagram"></svg>
      <div class="legend"><span><i style="background:var(--good)"></i><span data-i18n="legGood"></span></span><span><i style="background:var(--warn)"></i><span data-i18n="legWarn"></span></span><span><i style="background:var(--crit)"></i><span data-i18n="legCrit"></span></span><span data-i18n="legPulse"></span></div>
      <div class="readhow">
        <div><b id="rh1h"></b><span id="rh1"></span></div>
        <div><b data-i18n="rh2h"></b><span data-i18n="rh2"></span></div>
        <div><b data-i18n="rh3h"></b><span data-i18n="rh3"></span></div>
        <div><b data-i18n="rh4h"></b><span data-i18n="rh4"></span></div>
      </div>
      <div class="orgcap" id="orgCap"></div>
    </div>
    <div class="panel" id="score"></div>
  </section>

  <section>
    <div class="panel-head" style="margin-bottom:8px"><h2 data-i18n="vitalsTitle"></h2><p data-i18n="vitalsSub"></p></div>
    <div class="vgrid" id="vitals"></div>
  </section>

  <section class="g-mid">
    <div class="panel" id="drillPanel"></div>
    <div class="panel" id="treat">
      <div class="panel-head"><h2 data-i18n="treatTitle"></h2><p data-i18n="treatSub"></p></div>
      <div class="locked" id="locked" hidden></div>
      <div class="budget"><span class="eyebrow" data-i18n="budget"></span><div class="bar"><i id="budgetBar"></i></div><span class="mono" id="budgetTxt"></span></div>
      <div class="ivlist" id="ivlist"></div>
      <div class="sub-h"><h2 data-i18n="stressTitle"></h2><p class="disclaimer" data-i18n="stressSub"></p></div>
      <div class="ds-row" style="gap:8px;margin-bottom:4px"><label class="eyebrow" for="shockSev" data-i18n="sevLbl"></label><select id="shockSev"><option value="mild" data-i18n="sev_mild"></option><option value="severe" selected data-i18n="sev_severe"></option><option value="extreme" data-i18n="sev_extreme"></option></select></div>
      <div class="shocks" id="shocks"></div>
      <div class="active-shocks" id="activeShocks"></div>
      <div id="shockImpact"></div>
    </div>
  </section>

  <section class="panel" id="advisor" aria-live="polite"></section>

  <section class="g-mid">
    <div class="panel">
      <div class="panel-head"><h2 data-i18n="ledgerTitle"></h2><p data-i18n="ledgerSub"></p></div>
      <div class="flowhead"><span></span><div class="fh"><span data-i18n="depl"></span><span data-i18n="regenH"></span></div><span style="text-align:end" data-i18n="netStock"></span></div>
      <div class="ledger" id="ledger"></div>
      <div id="growthFlag"></div>
    </div>
    <div class="panel">

      try{const j=JSON.parse(f.text);if(j&&(j.name_en||j.name_ar||j.iso3||j.country)){meta=j;info.files.push({name,role:'country'})}else info.files.push({name,role:'ignored'})}
      catch(e){info.files.push({name,role:'ignored'})}
      continue}
    const p=parseCSV(f.text),H=new Set(p.header);
    const has=(...a)=>a.some(x=>H.has(x));
    if(has('from_kpi')&&has('to_kpi')){linkRows.push(...p.rows);info.files.push({name,role:'links',n:p.rows.length})}
    else if(has('kpi_id','kpi','indicator_id')&&has('period','date','month')&&has('value','val')){obsRows.push(...p.rows.map(r=>({...r,_file:name,_delim:p.delim})));info.files.push({name,role:'obs',n:p.rows.length})}
    else if(has('kpi_id')&&has('worst_value','best_value','name_en','name_ar')){catalogRows.push(...p.rows.map(r=>({...r,_delim:p.delim})));info.files.push({name,role:'catalog',n:p.rows.length})}
    else info.files.push({name,role:'ignored'});
  }
  // ---- catalog
  const kpis=BUILTIN_KPIS.map(cloneKpi),byId=Object.fromEntries(kpis.map(k=>[k.id,k])),custom=[];
  for(const r of catalogRows){
    const id=pick(r,'kpi_id').trim();if(!id){push('w',()=>t('r_catBad',{row:r._row,why:'kpi_id'}));continue}
    const num=c=>parseNum(r[c],r._delim);
    const w={};VIDS.forEach(v=>{const x=num('w_'+v);if(Number.isFinite(x)&&x>0)w[v]=x});
    const hasW=VIDS.some(v=>(r['w_'+v]??'')!=='');
    let k=byId[id];
    if(!k){
      const lo=num('worst_value'),hi=num('best_value');
      if(!Number.isFinite(lo)||!Number.isFinite(hi)||lo===hi){push('w',()=>t('r_catBad',{row:r._row,why:'worst_value/best_value'}));continue}
      if(!Object.keys(w).length){push('w',()=>t('r_catBad',{row:r._row,why:'w_* weights'}));continue}
      k={id,name:B(id,id),unit:B('',''),lo,hi,dec:1,lead:false,agency:B('—','—'),src:B('—','—'),freq:'annual',conf:'medium',target:hi,w,def:B('','')};
      kpis.push(k);byId[id]=k;custom.push(id);
    }
    const setB=(field,en,ar)=>{if(r[en])k[field].en=r[en];if(r[ar])k[field].ar=r[ar]};
    setB('name','name_en','name_ar');setB('unit','unit_en','unit_ar');setB('agency','agency_en','agency_ar');setB('src','source_en','source_ar');setB('def','definition_en','definition_ar');
    if(!k.name.ar)k.name.ar=k.name.en;
    const lo=num('worst_value'),hi=num('best_value');
    if(Number.isFinite(lo)&&Number.isFinite(hi)&&lo!==hi){k.lo=lo;k.hi=hi}
    const tg=num('target');if(Number.isFinite(tg))k.target=tg;
    const dc=num('decimals');if(Number.isFinite(dc))k.dec=clamp(Math.round(dc),0,4);
    const role=(r.role||'').toLowerCase();if(role.startsWith('lead'))k.lead=true;else if(role.startsWith('lag'))k.lead=false;
    const fq=(r.frequency||'').toLowerCase();if(['monthly','quarterly','annual'].includes(fq))k.freq=fq;
    const cf=(r.confidence||'').toLowerCase();if(['high','medium','low'].includes(cf))k.conf=cf;
    if(hasW&&Object.keys(w).length)k.w=w;
  }
  if(custom.length)push('i',()=>t('r_custom',{n:custom.length,list:custom.join(', ')}));
  // ---- links
  const links=BUILTIN_LINKS.map(l=>({...l}));let nl=0;
  for(const r of linkRows){
    const from=r.from_kpi,to=r.to_kpi,w=parseNum(r.weight,','),lag=parseNum(r.lag_months,',');
    if(!byId[from]||!byId[to]||!Number.isFinite(w))continue;
    const ex=links.find(l=>l.from===from&&l.to===to);
    const lg=Number.isFinite(lag)?clamp(Math.round(lag),0,7):2;
    if(ex){ex.w=w;ex.lag=lg}else links.push({from,to,w,lag:lg});nl++;
  }
  if(nl)push('i',()=>t('r_links',{n:nl}));
  // ---- observations
  const geos=[...new Set(obsRows.map(r=>pick(r,'geo','geography','region')))].sort();
  const geo=geos.includes(geoChoice)?geoChoice:(geos.includes('')?'':geos[0]??'');
  if(geos.length>1)push('i',()=>t('r_geo',{n:geos.length,g:geo||t('geoNational')}));
  const pts={},rej=[];let dupes=0,clampedN=0,accepted=0;
  for(const r of obsRows){
    if(pick(r,'geo','geography','region')!==geo)continue;
    const id=pick(r,'kpi_id','kpi','indicator_id'),per=pick(r,'period','date','month'),val=pick(r,'value','val');
    if(!byId[id]){rej.push(()=>t('r_unknown',{id,row:r._row}));continue}
    const key=parsePeriod(per);if(key==null){rej.push(()=>t('r_badPeriod',{p:per,row:r._row}));continue}
    const v=parseNum(val,r._delim);if(!Number.isFinite(v)){rej.push(()=>t('r_badValue',{v:val,row:r._row}));continue}
    const m=(pts[id]??={});if(m[key]){m[key][0]+=v;m[key][1]++;dupes++}else m[key]=[v,1];accepted++;
  }
  if(rej.length)push('w',()=>t('r_rejected',{n:rej.length,ex:rej.slice(0,4).map(f=>f()).join('; ')+(rej.length>4?' …':'')}));
  const ids=Object.keys(pts);
  if(!ids.length){push('e',()=>t('r_noObs'));return{ok:false,rep,info,geos,geo}}
  let start=Infinity,end=-Infinity;
  ids.forEach(id=>Object.keys(pts[id]).forEach(k=>{k=+k;if(k<start)start=k;if(k>end)end=k}));
  if(end-start+1>240){start=end-239;push('w',()=>t('r_trim'))}
  const n=end-start+1;
  if(n<7)push('w',()=>t('r_short',{n}));
  const obs={},flags={},missing=new Set(),stale=[],back=[];
  kpis.forEach(k=>{
    const m=pts[k.id];
    if(!m){missing.add(k.id);return}
    const keys=Object.keys(m).map(Number).filter(x=>x>=start).sort((a,b)=>a-b);
    if(!keys.length){missing.add(k.id);return}
    const vals=keys.map(x=>m[x][0]/m[x][1]);
    vals.forEach(v=>{const h=healthOf(k,v);if(h<0||h>100)clampedN++});
    const arr=new Array(n);let j=0;
    for(let i=0;i<n;i++){const key=start+i;
      while(j<keys.length-1&&keys[j+1]<=key)j++;
      let v;if(key<=keys[0])v=vals[0];else if(key>=keys[keys.length-1])v=vals[vals.length-1];
      else{const a=keys[j],b=keys[j+1];v=vals[j]+(vals[j+1]-vals[j])*(key-a)/(b-a)}
      arr[i]=clamp(healthOf(k,v),0,100)}
    obs[k.id]=arr;
    flags[k.id]={count:keys.length,lastKey:keys[keys.length-1],firstKey:keys[0],lastQuality:''};
    if(keys[0]>start)back.push(k.id);
    if(end-keys[keys.length-1]>12)stale.push(k.id);
  });
  // quality flag of the last observation
  for(const r of obsRows){if(pick(r,'geo','geography','region')!==geo)continue;const id=pick(r,'kpi_id','kpi','indicator_id');const f=flags[id];if(!f)continue;
    if(parsePeriod(pick(r,'period','date','month'))===f.lastKey){const q=pick(r,'quality','quality_flag','status');if(q)f.lastQuality=q}}
  const kn=id=>L(byId[id].name);
  push('ok',()=>t('r_obsOk',{n:accepted,k:ids.filter(id=>obs[id]).length}));
  if(dupes)push('w',()=>t('r_dupes',{n:dupes}));
  if(clampedN)push('w',()=>t('r_clamped',{n:clampedN}));
  if(missing.size)push('w',()=>t('r_missing',{n:missing.size,list:[...missing].slice(0,8).map(kn).join(t('comma'))+(missing.size>8?' …':'')}));
  if(back.length)push('i',()=>t('r_backfill',{n:back.length}));
  if(stale.length)push('w',()=>t('r_stale',{n:stale.length,list:stale.slice(0,6).map(kn).join(t('comma'))}));
  const coverage={};VS.forEach(v=>{let a=0,b=0;kpis.forEach(k=>{const w=k.w[v.id];if(w){b+=w;if(!missing.has(k.id))a+=w}});coverage[v.id]=b?a/b:0});
  return{ok:true,rep,info,geos,geo,kpis,links,meta,start,n,obs,flags,missing,coverage,accepted,kCount:kpis.length-missing.size};
}

function newRealState(ds){
  const s=blankState();s.real=true;s.ds=ds;s.baseKey=ds.start;s.obs=ds.obs;s.obsEnd=ds.n-1;s.missing=ds.missing;s.rng=rngOf(777);
  KPIS.forEach(k=>{const h=isMiss(s,k.id)?50:ds.obs[k.id][0];s.h[k.id]=h;s.anchor[k.id]=h;s.hist[k.id]=[h]});
  return s;
}

function catalogCSV(){

function periodOf(key,freq){const y=Math.floor(key/12),m=key%12;
  if(freq==='monthly')return `${y}-${String(m+1).padStart(2,'0')}`;
  if(freq==='quarterly')return m%3===2?`${y}-Q${(m+1)/3}`:null;
  return m===11?String(y):null}
function observationsRows(s,geoLabel,offset){
  const rows=[];const len=s.hist[KPIS[0].id].length;
  KPIS.forEach(k=>{if(isMiss(s,k.id))return;for(let i=0;i<len;i++){const key=s.baseKey+i;const p=periodOf(key,k.freq);if(!p)continue;

}

const wbUrl=(geo,code,pp)=>`${WB}/country/${geo}/indicator/${code}?format=json&date=${WB_FROM}:${WB_TO}&per_page=${pp}${src3(code)?'&source=3':''}`;

async function wbGet(url){
  const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();if(!Array.isArray(j)||j[0]?.message)throw new Error(j?.[0]?.message?.[0]?.value||'Bad response');
  return j;
}
async function pool(items,n,fn,onDone){let i=0,done=0;const out=new Array(items.length);
  await Promise.all([...Array(Math.min(n,items.length))].map(async()=>{while(i<items.length){const k=i++;try{out[k]=await fn(items[k])}catch(e){out[k]={error:e}}done++;onDone&&onDone(done,items.length)}}));return out}

async function wbFetchCountry(iso3,onProgress){
  const series={};let lastupdated='';let failed=0;
  const res=await pool(WBCODES,6,async code=>{const j=await wbGet(wbUrl(iso3,code,200));const s={};(j[1]||[]).forEach(r=>{if(r.value!=null)s[r.date]=+r.value});if(j[0]?.lastupdated>lastupdated)lastupdated=j[0].lastupdated;return[code,s]},onProgress);
  res.forEach(r=>{if(r&&!r.error)series[r[0]]=r[1];else failed++});
  if(failed===WBCODES.length)throw res.find(r=>r?.error)?.error||new Error('fetch failed');
  return{iso3,series,lastupdated,fetched:Date.now(),failed};
}
async function wbFetchAll(onProgress){

function wbToFiles(iso3,series,info){
  const obs=[['kpi_id','period','value','geo','quality']],cat=[['kpi_id','name_en','name_ar','unit_en','unit_ar','worst_value','best_value','target','decimals','frequency','confidence','source_en','source_ar','definition_en','definition_ar']];
  for(const m of WBMAP){
    const s=series[m.code];if(!s)continue;
    const years=Object.keys(s).map(Number).sort((a,b)=>a-b);
    years.forEach((y,i)=>{let v=s[y];
      if(m.per){const p=series[m.per]?.[y];if(!p)return;v=v/p*1000}
      if(m.diff){const prev=s[y-1];if(prev==null)return;v=v-prev}
      if(Number.isFinite(v))obs.push([m.kpi,String(y),+v.toFixed(4),'',y>=WB_TO-1?'provisional':''])});
    const k=KBY[m.kpi]||BUILTIN_KPIS.find(x=>x.id===m.kpi);
    const nm=m.name||k.name,un=m.unit||k.unit,df=m.def||k.def;
    const srcEn=`World Bank ${m.src3?'WGI':'WDI'} · ${m.code}`+(m.note?` (${m.note.en})`:''),srcAr=`البنك الدولي ${m.src3?'WGI':'WDI'} · ${m.code}`+(m.note?` (${m.note.ar})`:'');
    cat.push([m.kpi,nm.en,nm.ar,un.en,un.ar,m.lo??k.lo,m.hi??k.hi,m.target??k.target,m.dec??k.dec,'annual',m.note||m.src3?'medium':'high',srcEn,srcAr,df.en,df.ar]);
  }
  const a2=GEO[iso3]?.[0];const nm=lg=>{try{return new Intl.DisplayNames([lg],{type:'region'}).of(a2)}catch(e){return iso3}};
  const meta={name_en:nm('en'),name_ar:nm('ar'),iso3,source:'World Bank',lastupdated:info.lastupdated,fetched:info.fetched,from:info.from};
  return[{name:'worldbank_observations.csv',text:toCSV(obs)},{name:'worldbank_catalog.csv',text:toCSV(cat)},{name:'country.json',text:JSON.stringify(meta)}];
}

function spark(vals,w,h,color,opts={}){
  const v=vals.filter(Number.isFinite);
  if(v.length<2)return `<svg viewBox="0 0 ${w} ${h}"></svg>`;
  const mn=opts.min??Math.min(...v),mx=opts.max??Math.max(...v),r=(mx-mn)||1,pad=3;
  const X=i=>pad+(w-2*pad)*i/(v.length-1),Y=x=>h-pad-(h-2*pad)*(x-mn)/r;
  const pts=v.map((x,i)=>`${X(i).toFixed(1)},${Y(x).toFixed(1)}`).join(' ');
  let band='';if(opts.band){const y1=Y(clamp(opts.band[1],mn,mx)),y0=Y(clamp(opts.band[0],mn,mx));band=`<rect x="0" y="${Math.min(y0,y1)}" width="${w}" height="${Math.abs(y0-y1)}" fill="var(--good)" opacity=".08"/>`}
  let split='';if(opts.splitAt!=null&&opts.splitAt>0&&opts.splitAt<v.length-1){const x=X(opts.splitAt);split=`<line x1="${x}" x2="${x}" y1="0" y2="${h}" stroke="var(--ink3)" stroke-dasharray="2 2" opacity=".6"/>`}
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${band}${split}<polygon points="${pad},${h} ${pts} ${w-pad},${h}" fill="${color}" opacity=".1"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="${X(v.length-1)}" cy="${Y(v[v.length-1])}" r="2.6" fill="${color}"/></svg>`;
}

function fictionalShape(){
  const r=rngOf(99),ph=[...Array(6)].map(()=>r()*6.283),main=[],isl=[];
  for(let i=0;i<120;i++){const a=i/120*2*Math.PI;const rad=1+.17*Math.sin(2*a+ph[0])+.11*Math.sin(3*a+ph[1])+.07*Math.sin(5*a+ph[2])+.035*Math.sin(11*a+ph[3]);main.push([Math.cos(a)*rad,Math.sin(a)*rad*1.3])}
  for(let i=0;i<28;i++){const a=i/28*2*Math.PI;const rad=.17+.03*Math.sin(3*a+ph[4]);isl.push([1.32+Math.cos(a)*rad,-1.05+Math.sin(a)*rad*1.3])}
  return[[main],[isl]];
}

function resolveIso(v){

function silhouettePath(c,cx,cy,size){
  const all=c.polys.flat(2);
  let mnx=Infinity,mxx=-Infinity,mny=Infinity,mxy=-Infinity;all.forEach(([x,y])=>{if(x<mnx)mnx=x;if(x>mxx)mxx=x;if(y<mny)mny=y;if(y>mxy)mxy=y});
  const k=c.fictional?1:Math.cos((mny+mxy)/2*Math.PI/180);
  const w=(mxx-mnx)*k||1,h=(mxy-mny)||1,sc=size/Math.max(w,h);
  const ox=cx-w*sc/2,oy=cy-h*sc/2;
  return c.polys.map(p=>p.map(r=>'M'+r.map(([x,y])=>(ox+(x-mnx)*k*sc).toFixed(1)+' '+(oy+(mxy-y)*sc).toFixed(1)).join('L')+'Z').join('')).join('');
}

async function wbAllCodes(codes,onProg){
  const out={};let snap=null;try{snap=await idbGet(wbKey('snapshot'))}catch(e){}
  let done=0;const need=[];
  for(const code of codes){
    if(snap?.codes?.includes(code)){const o={};for(const c in snap.countries){const s=snap.countries[c][code];if(s)o[c]=s}out[code]=o;done++;continue}
    let c=null;try{c=await idbGet('wball:'+code)}catch(e){}
    if(c&&Date.now()-c.fetched<WB_TTL){out[code]=c.data;done++}else need.push(code)}
  onProg&&onProg(done,codes.length);
  const res=await pool(need,4,async code=>{const j=await wbGet(wbUrl('all',code,20000));const o={};
    (j[1]||[]).forEach(r=>{const c=r.countryiso3code;if(!c||r.value==null||!GEO[c])return;(o[c]??={})[r.date]=+r.value});
    try{await idbSet('wball:'+code,{fetched:Date.now(),data:o})}catch(e){}
    out[code]=o;return code},(d)=>onProg&&onProg(done+d,codes.length));
  if(need.length&&res.every(r=>r?.error))throw res[0].error;
  return out;
}

const quant=(a,q)=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);const i=(s.length-1)*q,lo=Math.floor(i),hi=Math.ceil(i);return s[lo]+(s[hi]-s[lo])*(i-lo)};

function computeBenchmark(vid,all,meta,you,group){
  const rows=[],learnScore={};
  for(const {k,w} of contributors(vid)){
    const m=WBMAP.find(x=>x.kpi===k.id);
    if(!m){rows.push({k,w,noGlobal:true});continue}
    const byC={};
    for(const c of Object.keys(meta)){const bycode={};bycode[m.code]=all[m.code]?.[c];if(m.per)bycode[m.per]=all[m.per]?.[c];const vals=kpiValues(m,bycode);const ys=Object.keys(vals).map(Number).sort((a,b)=>a-b);if(!ys.length)continue;
      const y1=ys[ys.length-1],v1=vals[y1];let y0=null;for(const y of ys){if(y>=y1-12&&y<=y1-7&&(y0==null||Math.abs(y-(y1-10))<Math.abs(y0-(y1-10))))y0=y}
      const h=v=>clamp(healthOf(k,v),0,100);byC[c]={y1,v1,h1:h(v1),y0,v0:y0!=null?vals[y0]:null,h0:y0!=null?h(vals[y0]):null}}
    const me=you?byC[you]:null;
    const inGroup=c=>c!==you&&(!you||!meta[you]||group==='all'||(group==='region'?meta[c].region===meta[you].region:meta[c].income===meta[you].income));
    const peers=Object.keys(byC).filter(inGroup);
    const hs=peers.map(c=>byC[c].h1);
    const med=quant(hs,.5),p75=quant(hs,.75);
    let best=null;peers.forEach(c=>{if(!best||byC[c].h1>byC[best].h1)best=c});
    const withStart=peers.filter(c=>byC[c].h0!=null&&byC[c].h1-byC[c].h0>2);
    let imp=me?withStart.filter(c=>Math.abs(byC[c].h0-me.h1)<=15):withStart;
    let loose=false;if(imp.length<3){imp=withStart;loose=true}
    imp.sort((a,b)=>(byC[b].h1-byC[b].h0)-(byC[a].h1-byC[a].h0));
    const improvers=imp.slice(0,4).map(c=>({c,...byC[c],gain:byC[c].h1-byC[c].h0}));
    imp.slice(0,8).forEach((c,i)=>{const g=byC[c].h1-byC[c].h0;const L=learnScore[c]??={s:0,w:0,n:0};L.s+=g*w*(1-i*.06);L.w+=w;L.n++});
    rows.push({k,w,m,me,n:peers.length,med,p75,best:best?{c:best,...byC[best]}:null,improvers,loose});
  }
  const learners=Object.entries(learnScore).map(([c,v])=>({c,score:v.s/v.w*Math.min(1,.5+v.n*.25),n:v.n})).sort((a,b)=>b.score-a.score).slice(0,5);
  return{rows,learners,group,you,meta:you?meta[you]:null,when:Date.now()};
}

function buildCallout(c,view){
  const anc=ANCH[view],art={body:artBody,tree:artTree,cell:artCell}[view]();
  const ids=VS.map((v,i)=>i);
  let left=ids.filter(i=>anc[i][0]<300||(anc[i][0]===300&&i%2===0)),right=ids.filter(i=>!left.includes(i));
  while(left.length>5){left.sort((a,b)=>anc[b][0]-anc[a][0]);right.push(left.shift())}
  while(right.length>5){right.sort((a,b)=>anc[a][0]-anc[b][0]);left.push(right.shift())}
  left.sort((a,b)=>anc[a][1]-anc[b][1]);right.sort((a,b)=>anc[a][1]-anc[b][1]);
  const pos={};left.forEach((i,r)=>pos[i]={x:COLX2[0],y:ROWY2[r]+22,side:-1});right.forEach((i,r)=>pos[i]={x:COLX2[1],y:ROWY2[r]+22,side:1});
  let h=`<g class="art-wrap" id="artWrap">${art}</g><g>`;
  EDGES.forEach((e,i)=>{const p=anc[VIDX[e.a]],q=anc[VIDX[e.b]];const mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2;const qx=mx+(300-mx)*.3+(q[1]-p[1])*.1,qy=my+(260-my)*.3-(q[0]-p[0])*.1;
    h+=`<path class="org-edge thin" id="e${i}" data-a="${e.a}" data-b="${e.b}" d="M${p[0]} ${p[1]} Q${qx.toFixed(1)} ${qy.toFixed(1)} ${q[0]} ${q[1]}" stroke-width="${(.6+e.w).toFixed(2)}"><title>${esc(L(SYSNAME[e.a])+' → '+L(SYSNAME[e.b]))}</title></path>`});
  h+='</g>';
  VS.forEach((v,i)=>{const n=pos[i],a=anc[i],ex=n.x-n.side*24,mid=(ex+a[0])/2;
    const lead=`<path class="leader" d="M${ex} ${n.y} C${mid} ${n.y} ${mid} ${a[1]} ${a[0]} ${a[1]}"/><circle class="site-halo" cx="${a[0]}" cy="${a[1]}" r="6"/><circle class="site" cx="${a[0]}" cy="${a[1]}" r="5.5"/>`;
    h+=scoreNode(v,n.x,n.y,24,false,partName(i),lead)});
  h+=countryBadge(c,225,470-2);
  return{vb:'-34 0 668 548',h};
}

  S=newSynthState(sc,1234+SCENARIOS.indexOf(sc)*97);buildOrganism();
  updateLedger(S);evaluate(S);
  for(let i=0;i<WARMUP;i++)step(S,true,true);
  S.silent=false;S.events=[];S.warnKeys=new Set(S.an.warns.map(w=>w.v));
  logEv(S,'info',()=>t('log_open',{name:L(sc.name)}));
  sel.vital=(S.an.sorted[0]||{id:VS[0].id}).id;sel.kpi=pickWorstKpi(sel.vital);
  treatSig='';renderAll();
}
function startReal(ds,cursor){
  setPlaying(false);
  buildModel(ds.kpis,ds.links);
  S=newRealState(ds);buildOrganism();updateLedger(S);evaluate(S);S.an=analyze(S);
  S.silent=false;
  logEv(S,'info',()=>t('log_openReal',{obs:ds.accepted,k:ds.kCount,from:monthKeyLabel(ds.start),to:monthKeyLabel(ds.start+ds.n-1)}));
  const target=cursor==null?S.obsEnd:Math.min(cursor,S.obsEnd);
  for(let i=0;i<target;i++)step(S,true,true);
  if(S.obsEnd===0)startSimFromObs(S);
  sel.vital=(S.an.sorted[0]||{id:VS[0].id}).id;sel.kpi=pickWorstKpi(sel.vital);
  treatSig='';renderAll();
}
function loadReal(files,src,geo){
  const prevK=KPIS,prevL=LINKS;
  const ds=processFiles(files,geo);
  lastLoad={...src,files,ds};
  if(src.source==='online')lastOnline=lastLoad;else lastFiles=lastLoad;
  if(!ds.ok){if(KPIS!==prevK)buildModel(prevK,prevL);renderDataPanel();return}
  startReal(ds,null);
}
function setPlaying(on){
  clearInterval(timer);timer=null;
  if(on)timer=setInterval(tick,+$('#speed').value);

}
function tick(){step(S,true,true);renderAll()}
function setMode(mode){
  srcMode=mode;
  const act=mode==='online'?lastOnline:lastFiles;
  if(act?.ds?.ok){if(S.ds!==act.ds)startReal(act.ds,null);else renderDataPanel()}
  else if(mode==='online')loadOnline(wbPick);
  else renderDataPanel();
}
async function loadOnline(iso3,force){
  const token=++wbToken,prof=PROFILE;srcMode='online';wbPick=iso3;try{localStorage.setItem('nvo.wbCountry',iso3)}catch(e){}
  wbBusy=true;onlineMsg='';renderDataPanel();
  const prog=(d,n)=>{if(token===wbToken)$('#wbProg').textContent=t('wbLoading',{country:regionName(iso3),done:d,total:n})};prog(0,WBCODES.length);
  let data=null,prov=null,err=null,cached=null;
  try{cached=await idbGet(wbKey(iso3))}catch(e){}
  if(!force&&cached&&Date.now()-cached.fetched<WB_TTL){data=cached;prov='cache'}
  else{
    try{data=await wbFetchCountry(iso3,prog);prov='live';try{await idbSet(wbKey(iso3),data)}catch(e){}}
    catch(e){err=e;
      let snap=null;try{snap=await idbGet(wbKey('snapshot'))}catch(x){}
      if(cached){data=cached;prov='cache'}
      else if(snap?.countries?.[iso3]){data={iso3,series:snap.countries[iso3],lastupdated:snap.lastupdated,fetched:snap.fetched};prov='snap'}
    }
  }
  if(token!==wbToken||prof!==PROFILE)return;
  wbBusy=false;$('#wbProg').textContent='';
  const msg=err?String(err.message||err).slice(0,80):'';
  if(!data){onlineMsg=esc(t('wbFail',{err:msg}));if(srcMode==='online'&&!S.real)renderAll();else renderDataPanel();return}
  const files=wbToFiles(iso3,data.series,data);
  if(srcMode!=='online')return;
  loadReal(files,{source:'online',iso3,prov,fetched:data.fetched});
  if(err&&prov!=='live'){onlineMsg='';$('#wbProg').textContent=t('wbFailKeep',{err:msg})}
}
function renderWbPicker(){
  $('#wbCountry').innerHTML=wbCountryOptions().map(([k,n])=>`<option value="${k}">${esc(n)}</option>`).join('');$('#wbCountry').value=wbPick;

/* folder + files */
const DATA_EXT=/\.(csv|tsv|txt|json)$/i;
async function readDir(handle){
  const files=[];
  for await (const [name,h] of handle.entries()){if(h.kind==='file'&&DATA_EXT.test(name)){const f=await h.getFile();files.push({name,text:await f.text()})}}
  return files.sort((a,b)=>a.name.localeCompare(b.name));
}
async function readFileList(list){
  const arr=Array.from(list).filter(f=>DATA_EXT.test(f.name));
  return Promise.all(arr.map(async f=>({name:f.webkitRelativePath||f.name,text:await f.text()})));
}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('nvo',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(k,v){const db=await idb();return new Promise(r=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=r;tx.onerror=r})}
async function idbGet(k){const db=await idb();return new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}
async function useHandle(h){
  const files=await readDir(h);
  try{await idbSet('dir',h)}catch(e){}
  loadReal(files,{source:'dir',handle:h},lastFiles?.ds?.geo);
}
$('#openFolder').addEventListener('click',async()=>{
  if(window.showDirectoryPicker){
    try{const h=await window.showDirectoryPicker({id:'nvo-data',mode:'read'});await useHandle(h)}

  }else $('#dirInput').click();
});
$('#chooseFiles').addEventListener('click',()=>$('#fileInput').click());
$('#dirInput').addEventListener('change',async e=>{const list=e.target.files;loadReal(await readFileList(list),{source:'input',fileObjs:Array.from(list)});e.target.value=''});
$('#fileInput').addEventListener('change',async e=>{const list=e.target.files;loadReal(await readFileList(list),{source:'input',fileObjs:Array.from(list)});e.target.value=''});
$('#reloadData').addEventListener('click',async()=>{
  const lf=lastFiles;if(!lf)return;
  try{
    if(lf.handle){await useHandle(lf.handle);return}
    if(lf.fileObjs){loadReal(await readFileList(lf.fileObjs),lf,lf.ds?.geo);return}
    loadReal(lf.files,lf,lf.ds?.geo);
  }catch(e){loadReal(lf.files,lf,lf.ds?.geo)}
});
$('#reconnect').addEventListener('click',async()=>{
  const h=$('#reconnect')._handle;if(!h)return;
  try{let p=await h.queryPermission({mode:'read'});if(p!=='granted')p=await h.requestPermission({mode:'read'});if(p==='granted'){$('#reconnect').hidden=true;await useHandle(h)}}catch(e){}
});
$('#geo').addEventListener('change',e=>{if(lastFiles)loadReal(lastFiles.files,lastFiles,e.target.value)});

const drop=$('#drop');

function withBuiltin(fn){const k=KPIS,l=LINKS;try{return fn()}finally{if(KPIS!==k)buildModel(k,l)}}

$('#drillPanel').addEventListener('click',e=>{

    logEv(S,'iv',()=>t('log_whatif',{name:L(KBY[id].name),dir:v>0?t('whatifUp'):t('whatifDown')}));reevaluate(S);renderAll();return}

  reevaluate(S);treatSig='';renderAll();$('#iv-'+id)?.focus()});
$('#shocks').addEventListener('click',e=>{const b=e.target.closest('[data-shock]');if(!b||inObserved())return;applyShock(S,b.dataset.shock,$('#shockSev').value);renderAll()});

$('#wbCountry').addEventListener('change',e=>{mapPick='auto';try{localStorage.setItem('nvo.map','auto')}catch(er){}loadOnline(e.target.value)});

$('#wbAll').addEventListener('click',async()=>{
  wbBusy=true;renderDataPanel();
  try{const prof=PROFILE;const snap=await wbFetchAll((d,n)=>$('#wbProg').textContent=t('wbAllProg',{done:d,total:n}));
    snap.profile=prof;if(prof!==PROFILE)throw new Error('tab changed');

    const n=Object.keys(snap.countries).length,file=`${prof==='gov'?'gvo':'nvo'}_worldbank_snapshot_${new Date().toISOString().slice(0,10)}.json`;

$('#wbLoadSnap').addEventListener('click',()=>$('#snapInput').click());
$('#snapInput').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const snap=JSON.parse(await f.text());if(snap.format!=='nvo-worldbank-snapshot'||!snap.countries||(snap.profile||'nation')!==PROFILE)throw 0;

  }catch(x){$('#wbProg').textContent=t('wbSnapBad')}

const NATION={id:'nation',PLAYBOOK:NATION_PB,VS,SYSNAME,KPIS:BUILTIN_KPIS,LINKS:BUILTIN_LINKS,LEDGER,IVS,SHOCKS,SCENARIOS,PHRASE,PW,WBMAP,HEAD:{kpi:'gdp'},STR:{}};
const PROFILES={nation:NATION,gov:GOV},CTX={};
let PROFILE='nation';try{if(localStorage.getItem('nvo.tab')==='gov')PROFILE='gov'}catch(e){}
function wbKey(k){return (PROFILE==='gov'?'wbg:':'wb:')+k}
function applyProfile(p){
  VS=p.VS;VIDS=VS.map(v=>v.id);VBY=Object.fromEntries(VS.map(v=>[v.id,v]));VIDX=Object.fromEntries(VS.map((v,i)=>[v.id,i]));
  BUILTIN_KPIS=p.KPIS;BUILTIN_LINKS=p.LINKS;LEDGER=p.LEDGER;LEDGER.forEach(a=>{a.cap=a.in.reduce((x,y)=>x+y[2],0);a.capOut=a.out.reduce((x,y)=>x+y[2],0)});
  IVS=p.IVS;IVBY=Object.fromEntries(IVS.map(i=>[i.id,i]));SHOCKS=p.SHOCKS;SBY=Object.fromEntries(SHOCKS.map(x=>[x.id,x]));
  SCENARIOS=p.SCENARIOS;PHRASE=p.PHRASE;SYSNAME=p.SYSNAME;PW=p.PW;WBMAP=p.WBMAP;WBCODES=[...new Set(WBMAP.flatMap(m=>[m.code,m.per].filter(Boolean)))];
  HEAD=p.HEAD;PSTR=p.STR;PLAYBOOK=p.PLAYBOOK;buildModel(BUILTIN_KPIS,BUILTIN_LINKS);
  document.querySelectorAll('[data-tab]').forEach(b=>{const on=b.dataset.tab===p.id;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1});
}
function switchTab(id){
  if(id===PROFILE)return;
  setPlaying(false);wbToken++;wbBusy=false;$('#wbProg').textContent='';
  CTX[PROFILE]={S,lastOnline,lastFiles,srcMode,onlineMsg,sel:{...sel},K:KPIS,Lk:LINKS};
  PROFILE=id;try{localStorage.setItem('nvo.tab',id)}catch(e){}
  applyProfile(PROFILES[id]);
  const c=CTX[id];
  renderStatic();
  if(c){S=c.S;lastOnline=c.lastOnline;lastFiles=c.lastFiles;srcMode=c.srcMode;onlineMsg=c.onlineMsg;Object.assign(sel,c.sel);buildModel(c.K,c.Lk);buildOrganism();treatSig='';renderAll()}
  else{lastOnline=null;lastFiles=null;srcMode='online';onlineMsg='';sel.vital=null;sel.kpi=null;loadSynth(SCENARIOS[0].id);loadOnline(wbPick)}
}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
$('#tabs').addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;const ids=['nation','gov'];const i=ids.indexOf(PROFILE);const n=ids[(i+1)%2];switchTab(n);document.querySelector(`[data-tab="${n}"]`).focus()});

(async()=>{try{if(!('showDirectoryPicker' in window))return;const h=await idbGet('dir');if(h&&h.name){const b=$('#reconnect');b._handle=h;b.hidden=false;b.textContent=t('reconnect',{name:h.name})}}catch(e){}})();
window.__nvo={get S(){return S},ADV,computeBenchmark,buildPrompt,briefMarkdown,runBenchmark,switchTab,get PROFILE(){return PROFILE},get KPIS(){return KPIS},get SHOCKS(){return SHOCKS},get SCENARIOS_(){return SCENARIOS},eng:{newSynthState,step,updateLedger,evaluate,applyShockRaw:applyShock},wbToFiles,loadOnline,applyShock:(id,sev)=>{applyShock(S,id,sev);renderAll()},step:()=>{step(S,true,true)},newSynthState,project,buildModel,get BUILTIN_KPIS(){return BUILTIN_KPIS},get BUILTIN_LINKS(){return BUILTIN_LINKS},get SCENARIOS(){return SCENARIOS},loadReal,sampleFiles:()=>withBuiltin(sampleFiles),catalogCSV,linksCSV,observationsCSV,countryJSON,setLang,setMode,processFiles};
})();
